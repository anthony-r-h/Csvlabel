; CSVLABEL v0.4. Per-project templates. Column names match CSV headers.
; {Item} displays a changeable code; {id} is the stable record key.
; Use literal \n for a new line. Wrap italic text in [i]...[/i].
; Labels use white text, a white frame, and a black fill.
; width = 0 means no wrap. height/width are in drawing units.

[detail]
template={Item}: {Description}\nQty {Count} | {Thickness}\n[i]{Notes}[/i]
height=2.5
width=0
layer=CSV_LABELS

[compact]
template={Item} | {Description}
height=2.0
width=0
layer=CSV_LABELS

[cutting]
template={Item}: {Description}\n{Thickness} | x{Count}
height=2.5
width=0
layer=CUTTING_LABELS

[notes]
template={Item}: [i]{Notes}[/i]
height=2.0
width=0
layer=CSV_LABELS
