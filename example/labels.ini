; CSVLABEL v0.4. Per-project templates. Column names match CSV headers.
; {Item} displays a changeable code; {id} is the stable record key.
; Use literal \n for a new line. Text stays plain, no markup.
; color = ByLayer or ACI number (1 red, 2 yellow, 3 green, 4 cyan, 5 blue, 7 white/black)
; width = 0 means no wrap. height/width are in drawing units.

[detail]
template={Item}: {Description}\nQty {Count} | {Thickness}\n{Notes}
height=2.5
width=0
layer=CSV_LABELS
color=ByLayer
border=true
background=true

[compact]
template={Item} | {Description}
height=2.0
width=0
layer=CSV_LABELS
color=ByLayer
border=true
background=true

[cutting]
template={Item}: {Description}\n{Thickness} | x{Count}
height=2.5
width=0
layer=CUTTING_LABELS
color=ByLayer
border=true
background=true

[notes]
template={Item}: {Notes}
height=2.0
width=0
layer=CSV_LABELS
color=ByLayer
border=false
background=false
